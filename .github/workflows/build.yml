name: Build

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

env:
  BUILD_TYPE: Release
  # SDL 3 is built from source on Linux; these are the development files of the backends it can use
  # (X11, Wayland, ALSA, PulseAudio, PipeWire, ...). At runtime they are loaded only when present.
  SDL_LINUX_DEPS: >-
    cmake ninja-build libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev
    libxss-dev libxtst-dev libxkbcommon-dev libdrm-dev libgbm-dev libgl1-mesa-dev libgles2-mesa-dev
    libegl1-mesa-dev libdbus-1-dev libibus-1.0-dev libudev-dev libwayland-dev wayland-protocols
    libdecor-0-dev libasound2-dev libpulse-dev libpipewire-0.3-dev

jobs:
  # The play tests (scripted games, music recording, sanitizers) take several minutes. They run only
  # when something that can change the game was touched, for every release and when started by hand.
  changes:
    runs-on: ubuntu-24.04
    outputs:
      play: ${{ steps.diff.outputs.play }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        env:
          BEFORE: ${{ github.event.before }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          play=true
          from="${BASE:-$BEFORE}"
          if [[ "$GITHUB_REF" != refs/tags/* && "$GITHUB_EVENT_NAME" != workflow_dispatch && -n "$from" ]] \
             && git cat-file -e "$from^{commit}" 2>/dev/null; then
            changed="$(git diff --name-only "$from" "$GITHUB_SHA")"
            echo "$changed"
            if ! grep -qE '^(src/|gamedata/|tests/|scripts/|tools/|CMakeLists.txt|VERSION|\.github/)' <<<"$changed"; then
              play=false
            fi
          fi
          echo "play=$play" | tee -a "$GITHUB_OUTPUT"

  linux:
    needs: changes
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get -qq update && sudo apt-get install -y $SDL_LINUX_DEPS
      - name: Configure
        run: cmake -G Ninja -B build -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}
      - name: Build
        run: cmake --build build
      - name: Package
        run: |
          mkdir -p dist/DerClou
          cp -r gamedata/. dist/DerClou/
          cp build/build/x64/DerClou dist/DerClou/
          cp README.md PublicLicenceContract.txt mame.txt dist/DerClou/
          cp src/sound/nuked/LICENSE.txt dist/DerClou/LICENSE-Nuked-OPL3.txt
          tar -C dist -czf DerClou-linux-x64.tar.gz DerClou
      - name: Smoke test
        run: scripts/smoke-test.sh dist/DerClou/DerClou 10
      - name: Data tool round trip
        # every supported data file must survive JSON export and import byte for byte
        run: tests/run-data-test.sh
      - name: Scripted play tests
        if: needs.changes.outputs.play == 'true'
        run: |
          # the original never uses the new Game+ voices; Game+ does
          REJECT="PLUS/VOICE|Background sound" tests/run-script-test.sh build/build/x64/DerClou tests/scripts/story-start.txt
          EXPECT="Voice: .*PLUS/VOICE/HOTEL_ANT_11" tests/run-script-test.sh build/build/x64/DerClou tests/scripts/story-start-plus.txt
          # the title music must keep playing with both AdLib emulations
          tests/run-music-test.sh build/build/x64/DerClou "opl = nuked"
          tests/run-music-test.sh build/build/x64/DerClou "opl = mame"
          # skipping the intro right away must still start the title music in the menu
          MUSIC_SCRIPT=music-skip-intro tests/run-music-test.sh build/build/x64/DerClou "nointro = 0"
          SHOTDIR=tests/out/story-start-crt tests/run-script-test.sh build/build/x64/DerClou tests/scripts/story-start.txt "displayfilter = crt"
          REJECT="Planner: " tests/run-script-test.sh build/build/x64/DerClou tests/scripts/planning.txt "fullenv = 42" "storyoff = 42"
          # Game+ planner: guard routes and view areas, timeline with undo and redo
          EXPECT="Planner: redo action" tests/run-script-test.sh build/build/x64/DerClou tests/scripts/planning-plus.txt "fullenv = 42" "storyoff = 42"
          tests/run-script-test.sh build/build/x64/DerClou tests/scripts/walk-to.txt "fullenv = 42" "storyoff = 42"
          # original mode: results must match the reference, the difficulty must not matter
          # (and it must never start Lua)
          REJECT="Lua|Autosave" EXPECT_FILE=tests/expected/burglary-original.txt tests/run-script-test.sh build/build/x64/DerClou tests/scripts/burglary.txt "fullenv = 42" "storyoff = 42" "difficulty = hard"
          # Game+: autosave in the extra fifth slot before the burglary, it loads again as Game+
          (export TEST_HOME="$(mktemp -d)"
           EXPECT_FILE=tests/expected/burglary-plus.txt tests/run-script-test.sh build/build/x64/DerClou tests/scripts/burglary-plus.txt "fullenv = 42" "storyoff = 42"
           EXPECT="Game mode of the saved game: Game+" tests/run-script-test.sh build/build/x64/DerClou tests/scripts/burglary-plus-load.txt)
          # Game+ background sounds, never in the original
          EXPECT="Background sound: .*LOBBY" tests/run-script-test.sh build/build/x64/DerClou tests/scripts/story-start-plus.txt
          # Game+ night and weather: thunderstorm with lightning every 1.5 s, the burglary plays the same
          EXPECT="Thunder (close)" EXPECT_FILE=tests/expected/burglary-weather.txt tests/run-script-test.sh build/build/x64/DerClou tests/scripts/burglary-weather.txt "fullenv = 42" "storyoff = 42" "plusweather = storm" "plusflash = 1500"
          EXPECT_FILE=tests/expected/burglary-weather.txt REJECT="Weather|Light:" SHOTDIR=tests/out/burglary-weather-off tests/run-script-test.sh build/build/x64/DerClou tests/scripts/burglary-weather.txt "fullenv = 42" "storyoff = 42" "plusweather = off"
          # held arrow key repeats with the game's own timing
          tests/run-script-test.sh build/build/x64/DerClou tests/scripts/key-repeat.txt
          # smooth edges (Scale4x) with the CRT picture
          SHOTDIR=tests/out/story-smooth tests/run-script-test.sh build/build/x64/DerClou tests/scripts/story-start.txt "scale2x = 1" "displayfilter = crt"
          # Game+: balance from PLUS/BALANCE.LUA, mode restored from the saved game
          EXPECT_FILE=tests/expected/gamemode-plus.txt tests/run-script-test.sh build/build/x64/DerClou tests/scripts/gamemode.txt "fullenv = 42" "storyoff = 42" "difficulty = hard"
          # a script in MODFILES replaces the built-in one
          mkdir -p "$RUNNER_TEMP/luamods/PLUS" && sed 's/police = 80,/police = 50,/' gamedata/PLUS/BALANCE.LUA > "$RUNNER_TEMP/luamods/PLUS/BALANCE.LUA"
          MODFILES="$RUNNER_TEMP/luamods" EXPECT="Balance: police 50 %" tests/run-script-test.sh build/build/x64/DerClou tests/scripts/gamemode.txt "fullenv = 42" "storyoff = 42" "difficulty = hard"
          # replacement files in MODFILES are used instead of the original data
          mkdir -p "$RUNNER_TEMP/mods/PICTURES" && cp gamedata/PICTURES/MENU "$RUNNER_TEMP/mods/PICTURES/"
          MODFILES="$RUNNER_TEMP/mods" EXPECT="Modfile: .*PICTURES/MENU" tests/run-script-test.sh build/build/x64/DerClou tests/scripts/settings.txt
          # data files edited through JSON and rebuilt by tools/clou-data.py load from MODFILES
          tests/run-data-test.sh build/build/x64/DerClou
          export TEST_HOME="$(mktemp -d)"
          EXPECT="Settings saved" tests/run-script-test.sh build/build/x64/DerClou tests/scripts/settings.txt
          EXPECT_FILE=tests/expected/settings-reload.txt tests/run-script-test.sh build/build/x64/DerClou tests/scripts/settings-reload.txt
      - name: AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
          LDAI_OUTPUT: DerClou-linux-x86_64.AppImage
        run: |
          curl -sSLo linuxdeploy https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy
          mkdir -p AppDir/usr/bin
          cp -r gamedata/. AppDir/usr/bin/
          cp README.md PublicLicenceContract.txt mame.txt AppDir/usr/bin/
          cp src/sound/nuked/LICENSE.txt AppDir/usr/bin/LICENSE-Nuked-OPL3.txt
          ./linuxdeploy --appdir AppDir -e build/build/x64/DerClou \
            -d packaging/derclou.desktop -i packaging/derclou.png --output appimage
      - uses: actions/upload-artifact@v4
        with:
          name: DerClou-linux-x64
          path: |
            DerClou-linux-x64.tar.gz
            DerClou-linux-x86_64.AppImage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-screenshots
          path: tests/out

  sanitizers:
    needs: changes
    if: needs.changes.outputs.play == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get -qq update && sudo apt-get install -y $SDL_LINUX_DEPS
      - name: Configure (ASan + UBSan)
        run: cmake -G Ninja -B build -DCMAKE_BUILD_TYPE=Debug -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
      - name: Build
        run: cmake --build build
      - name: Scripted play tests
        run: |
          tests/run-script-test.sh build/build/x64/DerClou tests/scripts/story-start.txt
          tests/run-music-test.sh build/build/x64/DerClou "opl = nuked"
          SHOTDIR=tests/out/story-start-crt tests/run-script-test.sh build/build/x64/DerClou tests/scripts/story-start.txt "displayfilter = crt"
          REJECT="Planner: " tests/run-script-test.sh build/build/x64/DerClou tests/scripts/planning.txt "fullenv = 42" "storyoff = 42"
          # Game+ planner: guard routes and view areas, timeline with undo and redo
          EXPECT="Planner: redo action" tests/run-script-test.sh build/build/x64/DerClou tests/scripts/planning-plus.txt "fullenv = 42" "storyoff = 42"
          tests/run-script-test.sh build/build/x64/DerClou tests/scripts/walk-to.txt "fullenv = 42" "storyoff = 42"
          # original mode: results must match the reference, the difficulty must not matter
          # (and it must never start Lua)
          REJECT="Lua|Autosave" EXPECT_FILE=tests/expected/burglary-original.txt tests/run-script-test.sh build/build/x64/DerClou tests/scripts/burglary.txt "fullenv = 42" "storyoff = 42" "difficulty = hard"
          # Game+: autosave in the extra fifth slot before the burglary, it loads again as Game+
          (export TEST_HOME="$(mktemp -d)"
           EXPECT_FILE=tests/expected/burglary-plus.txt tests/run-script-test.sh build/build/x64/DerClou tests/scripts/burglary-plus.txt "fullenv = 42" "storyoff = 42"
           EXPECT="Game mode of the saved game: Game+" tests/run-script-test.sh build/build/x64/DerClou tests/scripts/burglary-plus-load.txt)
          # Game+ night and weather (thunderstorm, CRT picture and smooth edges)
          EXPECT_FILE=tests/expected/burglary-weather.txt tests/run-script-test.sh build/build/x64/DerClou tests/scripts/burglary-weather.txt "fullenv = 42" "storyoff = 42" "plusweather = storm" "plusflash = 1500" "displayfilter = crt" "scale2x = 1"
          # smooth edges (Scale4x) with the CRT picture
          SHOTDIR=tests/out/story-smooth tests/run-script-test.sh build/build/x64/DerClou tests/scripts/story-start.txt "scale2x = 1" "displayfilter = crt"
          # Game+: balance from PLUS/BALANCE.LUA, mode restored from the saved game
          EXPECT_FILE=tests/expected/gamemode-plus.txt tests/run-script-test.sh build/build/x64/DerClou tests/scripts/gamemode.txt "fullenv = 42" "storyoff = 42" "difficulty = hard"
          # a script in MODFILES replaces the built-in one
          mkdir -p "$RUNNER_TEMP/luamods/PLUS" && sed 's/police = 80,/police = 50,/' gamedata/PLUS/BALANCE.LUA > "$RUNNER_TEMP/luamods/PLUS/BALANCE.LUA"
          MODFILES="$RUNNER_TEMP/luamods" EXPECT="Balance: police 50 %" tests/run-script-test.sh build/build/x64/DerClou tests/scripts/gamemode.txt "fullenv = 42" "storyoff = 42" "difficulty = hard"
          # replacement files in MODFILES are used instead of the original data
          mkdir -p "$RUNNER_TEMP/mods/PICTURES" && cp gamedata/PICTURES/MENU "$RUNNER_TEMP/mods/PICTURES/"
          MODFILES="$RUNNER_TEMP/mods" EXPECT="Modfile: .*PICTURES/MENU" tests/run-script-test.sh build/build/x64/DerClou tests/scripts/settings.txt
          export TEST_HOME="$(mktemp -d)"
          EXPECT="Settings saved" tests/run-script-test.sh build/build/x64/DerClou tests/scripts/settings.txt
          EXPECT_FILE=tests/expected/settings-reload.txt tests/run-script-test.sh build/build/x64/DerClou tests/scripts/settings-reload.txt

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            zip
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-sdl3
      - name: Configure
        run: cmake -G Ninja -B build -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}
      - name: Build
        run: cmake --build build
      - name: Package
        run: |
          mkdir -p dist/DerClou
          cp -r gamedata/. dist/DerClou/
          cp build/build/x64/DerClou.exe dist/DerClou/
          # bundle every DLL from the MSYS2 environment the exe depends on
          ldd dist/DerClou/DerClou.exe | grep -i '/ucrt64/' | awk '{print $3}' | xargs -r -I{} cp {} dist/DerClou/
          cp README.md PublicLicenceContract.txt mame.txt dist/DerClou/
          cp src/sound/nuked/LICENSE.txt dist/DerClou/LICENSE-Nuked-OPL3.txt
          cd dist && zip -qr ../DerClou-windows-x64.zip DerClou
      - uses: actions/upload-artifact@v4
        with:
          name: DerClou-windows-x64
          path: DerClou-windows-x64.zip

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: brew install sdl3 dylibbundler
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}
      - name: Build
        run: cmake --build build -j
      - name: Package
        run: |
          mkdir -p dist/DerClou
          cp -r gamedata/. dist/DerClou/
          cp build/build/x64/DerClou dist/DerClou/
          dylibbundler -od -b -x dist/DerClou/DerClou -d dist/DerClou/libs -p @executable_path/libs
          cp README.md PublicLicenceContract.txt mame.txt dist/DerClou/
          cp src/sound/nuked/LICENSE.txt dist/DerClou/LICENSE-Nuked-OPL3.txt
          cd dist && zip -qry ../DerClou-macos.zip DerClou
      - uses: actions/upload-artifact@v4
        with:
          name: DerClou-macos
          path: DerClou-macos.zip

  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: mymindstorm/setup-emsdk@v14
      - name: Configure
        run: emcmake cmake -B build-web -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}
      - name: Build
        run: cmake --build build-web -j
      - name: Package
        run: |
          mkdir -p dist/web
          cp build-web/build/web/DerClou.* build-web/build/web/voices.* dist/web/
          cp dist/web/DerClou.html dist/web/index.html
          cp web/play/* dist/web/
          cp PublicLicenceContract.txt mame.txt dist/web/
          cp src/sound/nuked/LICENSE.txt dist/web/LICENSE-Nuked-OPL3.txt
          cd dist && zip -qr ../DerClou-web.zip web
      - uses: actions/upload-artifact@v4
        with:
          name: DerClou-web
          path: DerClou-web.zip
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: |
            web/site
            dist/web

  pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [ linux, web ]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: in
      - name: Assemble site
        run: |
          mkdir -p public/play
          cp -r in/web/site/. public/
          cp -r in/dist/web/. public/play/
          touch public/.nojekyll
      - name: Publish to GitHub Pages (gh-pages branch)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: public
          force_orphan: true
          user_name: darksoon
          user_email: ratzemail@googlemail.com

  release:
    # A release is made for a tag v*, or automatically when VERSION names a version without a release yet.
    if: github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main')
    needs: [ linux, sanitizers, windows, macos, web ]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Decide on release
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="${GITHUB_REF#refs/tags/}"
          else
            tag="v$(tr -d '[:space:]' < VERSION)"
          fi
          if [[ "$GITHUB_REF" != refs/tags/v* ]] && git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            echo "publish=false" >> "$GITHUB_OUTPUT"; echo "$tag already released"; exit 0
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          # release notes: the CHANGELOG section of this version
          awk -v v="## ${tag#v} " 'index($0, v) == 1 {on = 1; next} /^## / {on = 0} on' CHANGELOG.md > notes.md
          cat notes.md
      - uses: actions/download-artifact@v4
        if: steps.ver.outputs.publish == 'true'
        with:
          pattern: DerClou-*
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        if: steps.ver.outputs.publish == 'true'
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Der Clou! remastered ${{ steps.ver.outputs.tag }}
          body_path: notes.md
          files: artifacts/*
