name: Build

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

# jobs only read the repository; the two publishing jobs ask for write access themselves
permissions:
  contents: read

# a newer push to the same branch waits for the running one, so an older run never publishes last
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  BUILD_TYPE: Release
  # SDL 3 is built from source on Linux; these are the development files of the backends it can use
  # (X11, Wayland, ALSA, PulseAudio, PipeWire, ...). At runtime they are loaded only when present.
  SDL_LINUX_DEPS: >-
    cmake ninja-build libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev
    libxss-dev libxtst-dev libxkbcommon-dev libdrm-dev libgbm-dev libgl1-mesa-dev libgles2-mesa-dev
    libegl1-mesa-dev libdbus-1-dev libibus-1.0-dev libudev-dev libwayland-dev wayland-protocols
    libdecor-0-dev libasound2-dev libpulse-dev libpipewire-0.3-dev

jobs:
  # The play tests (scripted games, music recording, sanitizers) take several minutes. They run only
  # when something that can change the game was touched, for every release and when started by hand.
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    outputs:
      play: ${{ steps.diff.outputs.play }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        env:
          BEFORE: ${{ github.event.before }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          play=true
          from="${BASE:-$BEFORE}"
          if [[ "$GITHUB_REF" != refs/tags/* && "$GITHUB_EVENT_NAME" != workflow_dispatch && -n "$from" ]] \
             && git cat-file -e "$from^{commit}" 2>/dev/null; then
            changed="$(git diff --name-only "$from" "$GITHUB_SHA")"
            echo "$changed"
            if ! grep -qE '^(src/|gamedata/|tests/|scripts/|tools/|CMakeLists.txt|VERSION|\.github/)' <<<"$changed"; then
              play=false
            fi
          fi
          echo "play=$play" | tee -a "$GITHUB_OUTPUT"

  linux:
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get -qq update && sudo apt-get install -y $SDL_LINUX_DEPS
      - name: Configure
        run: cmake -G Ninja -B build -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}
      - name: Build
        run: cmake --build build
      - name: Package
        run: |
          mkdir -p dist/DerClou
          cp -r gamedata/. dist/DerClou/
          cp build/build/x64/DerClou dist/DerClou/
          cp README.md PublicLicenceContract.txt mame.txt dist/DerClou/
          cp src/sound/nuked/LICENSE.txt dist/DerClou/LICENSE-Nuked-OPL3.txt
          cp LICENSE-Lua.txt dist/DerClou/
          tar -C dist -czf DerClou-linux-x64.tar.gz DerClou
      - name: Smoke test
        run: scripts/smoke-test.sh dist/DerClou/DerClou 10
      - name: Data tool round trip
        # every supported data file must survive JSON export and import byte for byte
        run: tests/run-data-test.sh
      - name: Scripted play tests
        if: needs.changes.outputs.play == 'true'
        # four lanes in parallel, see tests/ci-play-tests.sh
        run: tests/ci-play-tests.sh build/build/x64/DerClou full
      - name: AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
          LDAI_OUTPUT: DerClou-linux-x86_64.AppImage
        run: |
          # a fixed release with its checksum instead of the moving "continuous" build
          curl -sSLo linuxdeploy https://github.com/linuxdeploy/linuxdeploy/releases/download/1-alpha-20251107-1/linuxdeploy-x86_64.AppImage
          echo "c20cd71e3a4e3b80c3483cef793cda3f4e990aca14014d23c544ca3ce1270b4d  linuxdeploy" | sha256sum -c -
          chmod +x linuxdeploy
          mkdir -p AppDir/usr/bin
          cp -r gamedata/. AppDir/usr/bin/
          cp README.md PublicLicenceContract.txt mame.txt AppDir/usr/bin/
          cp src/sound/nuked/LICENSE.txt AppDir/usr/bin/LICENSE-Nuked-OPL3.txt
          cp LICENSE-Lua.txt AppDir/usr/bin/
          ./linuxdeploy --appdir AppDir -e build/build/x64/DerClou \
            -d packaging/derclou.desktop -i packaging/derclou.png --output appimage
      - uses: actions/upload-artifact@v4
        with:
          retention-days: 14
          name: DerClou-linux-x64
          path: |
            DerClou-linux-x64.tar.gz
            DerClou-linux-x86_64.AppImage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          retention-days: 14
          name: test-screenshots
          path: tests/out

  sanitizers:
    needs: changes
    if: needs.changes.outputs.play == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get -qq update && sudo apt-get install -y $SDL_LINUX_DEPS
      - name: Configure (ASan + UBSan)
        run: cmake -G Ninja -B build -DCMAKE_BUILD_TYPE=Debug -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
      - name: Build
        run: cmake --build build
      - name: Scripted play tests
        run: tests/ci-play-tests.sh build/build/x64/DerClou sanitizer

  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            zip
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-sdl3
      - name: Configure
        run: cmake -G Ninja -B build -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}
      - name: Build
        run: cmake --build build
      - name: Package
        run: |
          mkdir -p dist/DerClou
          cp -r gamedata/. dist/DerClou/
          cp build/build/x64/DerClou.exe dist/DerClou/
          # bundle every DLL from the MSYS2 environment the exe depends on
          ldd dist/DerClou/DerClou.exe | grep -i '/ucrt64/' | awk '{print $3}' | xargs -r -I{} cp {} dist/DerClou/
          cp README.md PublicLicenceContract.txt mame.txt dist/DerClou/
          cp src/sound/nuked/LICENSE.txt dist/DerClou/LICENSE-Nuked-OPL3.txt
          cp LICENSE-Lua.txt dist/DerClou/
          # licence texts of the bundled DLLs (SDL, libiconv)
          mkdir -p dist/DerClou/licenses
          find /ucrt64/share/licenses -maxdepth 1 \( -iname '*sdl3*' -o -iname '*iconv*' \) -exec cp -r {} dist/DerClou/licenses/ \;
          ls dist/DerClou/licenses
          if [ -e dist/DerClou/libiconv-2.dll ] && ! ls dist/DerClou/licenses | grep -qi iconv; then echo "licence text of libiconv not found"; exit 1; fi
          cd dist && zip -qr ../DerClou-windows-x64.zip DerClou
      - uses: actions/upload-artifact@v4
        with:
          retention-days: 14
          name: DerClou-windows-x64
          path: DerClou-windows-x64.zip

  macos:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: brew install sdl3 dylibbundler
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}
      - name: Build
        run: cmake --build build -j
      - name: Package
        run: |
          mkdir -p dist/DerClou
          cp -r gamedata/. dist/DerClou/
          cp build/build/x64/DerClou dist/DerClou/
          dylibbundler -od -b -x dist/DerClou/DerClou -d dist/DerClou/libs -p @executable_path/libs
          cp README.md PublicLicenceContract.txt mame.txt dist/DerClou/
          cp src/sound/nuked/LICENSE.txt dist/DerClou/LICENSE-Nuked-OPL3.txt
          cp LICENSE-Lua.txt dist/DerClou/
          cd dist && zip -qry ../DerClou-macos.zip DerClou
      - uses: actions/upload-artifact@v4
        with:
          retention-days: 14
          name: DerClou-macos
          path: DerClou-macos.zip

  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 7.0.0
      - name: Configure
        run: emcmake cmake -B build-web -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}
      - name: Build
        run: cmake --build build-web -j
      - name: Package
        run: |
          mkdir -p dist/web
          cp build-web/build/web/DerClou.* build-web/build/web/voices.* dist/web/
          cp dist/web/DerClou.html dist/web/index.html
          cp web/play/* dist/web/
          cp PublicLicenceContract.txt mame.txt dist/web/
          cp src/sound/nuked/LICENSE.txt dist/web/LICENSE-Nuked-OPL3.txt
          cp LICENSE-Lua.txt dist/web/
          # program and data of one build carry the same version in their address (no mixing from the cache)
          sed -i "s/__DERCLOU_BUILD__/${GITHUB_SHA::10}/; s/\\(src=\"\\?\\)\\(DerClou\\|voices\\)\\.js/\\1\\2.js?${GITHUB_SHA::10}/g" dist/web/*.html
          grep -q "DerClou.js?${GITHUB_SHA::10}" dist/web/index.html
          cd dist && zip -qr ../DerClou-web.zip web
      - uses: actions/upload-artifact@v4
        with:
          retention-days: 14
          name: DerClou-web
          path: DerClou-web.zip
      - uses: actions/upload-artifact@v4
        with:
          retention-days: 14
          name: site
          path: |
            web/site
            dist/web

  pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [ linux, web ]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: in
      - name: Assemble site
        run: |
          mkdir -p public/play
          cp -r in/web/site/. public/
          cp -r in/dist/web/. public/play/
          touch public/.nojekyll
      - name: Publish to GitHub Pages (gh-pages branch)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: public
          force_orphan: true
          user_name: darksoon
          user_email: ratzemail@googlemail.com

  release:
    # A release is made for a tag v*, or automatically when VERSION names a version without a release yet.
    if: github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main')
    needs: [ linux, sanitizers, windows, macos, web ]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Decide on release
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="${GITHUB_REF#refs/tags/}"
          else
            tag="v$(tr -d '[:space:]' < VERSION)"
          fi
          if [[ "$GITHUB_REF" != refs/tags/v* ]] && git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            echo "publish=false" >> "$GITHUB_OUTPUT"; echo "$tag already released"; exit 0
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          # release notes: the CHANGELOG section of this version
          awk -v v="## ${tag#v} " 'index($0, v) == 1 {on = 1; next} /^## / {on = 0} on' CHANGELOG.md > notes.md
          cat notes.md
          # a release without its CHANGELOG section is a mistake
          test -s notes.md || { echo "CHANGELOG.md has no section for ${tag#v}"; exit 1; }
      - uses: actions/download-artifact@v4
        if: steps.ver.outputs.publish == 'true'
        with:
          pattern: DerClou-*
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        if: steps.ver.outputs.publish == 'true'
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Der Clou! remastered ${{ steps.ver.outputs.tag }}
          body_path: notes.md
          files: artifacts/*
          fail_on_unmatched_files: true
