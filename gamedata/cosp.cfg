screenwidth = 1280
screenheight = 960
fullscreen = 0
nointro = 1

# scale2x = 0

# window can be resized freely, the picture keeps its aspect ratio (default 1)
# resizable = 1
# scaling filter: nearest (sharp pixels, default) or linear (smooth)
# scalequality = nearest
# only scale by whole numbers for perfectly even pixels (default 0)
# integerscale = 0
# keys: F11 or Alt+Enter toggle fullscreen, F12 screenshot
# planning: right click in walk mode walks there, Tab toggles fast forward during the burglary

# difficulty: easy, normal or hard; only applies to games in Game+ mode, the original mode always plays normal
# easy: police needs 25% longer after an alarm, dealers pay 15% more
# hard: police is 20% faster, dealers pay 15% less
# difficulty = normal
# show the time until the police arrives once the alarm is loud (default 1)
# policetimer = 1
# speed of the fast forward (Tab) during the burglary: 2, 4 or 8 (default 4)
# fastforward = 4

# most of these options can also be changed in the main menu (settings); that menu stores them
# as settings.cfg in the user directory, which is read after this file and overrides it

# soundvolume = 255
# musicvolume = 255
# voicevolume = 255
# nofontshadow = 0
# joystick: 0 = off, 1..n = that joystick, auto = first one found (can be plugged in later)
# usejoystick = 0

# use demo = 42 to enable demo mode
# demo = 0

# use storyoff = 42 to disable story mode
# storyoff = 0

# use fullenv = 42 to enable full environment mode
# fullenv = 0

# use leveldesign = 42 to enable level design mode
# leveldesign = 0

# use guarddesign = 42 to enable guard design mode
# guarddesign = 0

# use nosamples = 42 to enable no samples mode? (no idea what this option is for)
# nosamples = 0

# use nocollision = 42 to disable collision checking
# nocollision = 0

# use showrooms = 42 to show rooms on map
# showrooms = 0

# use moremoney = 42 to get more money in many situations
# moremoney = 0
